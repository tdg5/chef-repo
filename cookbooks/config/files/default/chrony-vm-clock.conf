# Apple Silicon / QEMU guest clock hardening.
#
# This VM has no kvm-clock or PTP device; its clocksource is arch_sys_counter,
# which FREEZES whenever the M1 host laptop sleeps. On resume the guest is left
# minutes-to-hours behind real time. The stock "makestep 1 3" (in chrony.conf)
# only lets chronyd STEP the clock during the first 3 updates after start, so a
# post-sleep jump gets slewed back over many hours instead of corrected.
#
# Allow chronyd to step on ANY update whenever the offset exceeds 1 second.
# The "-1" means: no limit on how many times it may step (not just at startup).
# This drop-in is parsed after chrony.conf, so it overrides the earlier value.
makestep 1 -1
